<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 1 | Compliment Generator 💬</title>
  <style>
    :root {
      --bg1: #f6d365;
      --bg2: #fda085;
      --bg3: #f43f5e;
      --bg4: #7c3aed;
      --bg5: #22d3ee;
      --card: rgba(255,255,255,0.12);
      --card-border: rgba(255,255,255,0.2);
      --text: #fffafc;
      --muted: rgba(255,255,255,0.85);
      --shadow: rgba(29, 14, 51, 0.24);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 20%, var(--bg3) 50%, var(--bg4) 75%, var(--bg5) 100%);
      background-size: 200% 200%;
      animation: gradientMove 15s ease infinite;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      filter: blur(58px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: rgba(255,255,255,0.28);
      top: 8%;
      left: 12%;
      animation: float1 12s ease-in-out infinite;
    }

    body::after {
      background: rgba(255, 120, 180, 0.26);
      right: 10%;
      bottom: 10%;
      animation: float2 14s ease-in-out infinite;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(760px, calc(100% - 28px));
      animation: riseIn 0.7s ease-out both;
    }

    .card {
      background: rgba(30, 18, 50, 0.16);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 34px 28px 26px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 26px 60px var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.12), transparent 25%, rgba(255,255,255,0.08));
      pointer-events: none;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 18px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: -0.05em;
      text-shadow: 0 10px 28px rgba(255,255,255,0.12);
    }

    .subtitle {
      position: relative;
      z-index: 1;
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    #compliment {
      position: relative;
      z-index: 1;
      margin: 0 auto 22px;
      min-height: 84px;
      width: min(100%, 620px);
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      line-height: 1.6;
      font-size: clamp(1.1rem, 2.6vw, 1.45rem);
      color: #fff;
      opacity: 0;
      animation: fadeIn 1s forwards;
      box-shadow: inset 0 1px rgba(255,255,255,0.06);
    }

    .actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, #ffffff 0%, #ffeaf5 35%, #d9f7ff 100%);
      color: #4a1e66;
      padding: 14px 22px;
      min-width: 220px;
      box-shadow: 0 16px 30px rgba(255,255,255,0.2);
    }

    .secondary-btn {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 12px 18px;
      min-width: 200px;
    }

    button:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 20px 30px rgba(19, 5, 33, 0.2);
    }

    .lock-message {
      position: relative;
      z-index: 1;
      margin: 20px auto 0;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 320px;
      line-height: 1.7;
      display: none;
      animation: fadeIn 0.5s ease;
      color: #fff;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      font-size: 0.9rem;
      opacity: 0.82;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-20px) translateX(18px); }
    }

    @keyframes float2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(22px) translateX(-10px); }
    }

    @media (max-width: 560px) {
      .card { padding: 28px 18px 22px; }
      .actions { gap: 12px; }
      .primary-btn, .secondary-btn { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Day 1: Compliment Generator ✨</h1>
      <p class="subtitle">Click the button below to get a random compliment, Khizar!</p>

      <div id="compliment">💬 Your compliments will appear here 💬</div>

      <div class="actions">
        <button class="primary-btn" onclick="generateCompliment()">Get Compliment 💛</button>
        <button class="secondary-btn" onclick="nextDay()">Go to Day 2 ➜</button>
      </div>

      <div class="lock-message" id="lockMessage"></div>
      <footer>Created with ♥️ by Shahid 🧸</footer>
    </section>
  </main>

  <script>
    const compliments = [
      "1. You love to annoying me but you are special for Me ! ✨",
      "2. You’ve got the kind of smile that can fix my bad mood 😊",
      "3. Khizar, you’re seriously one of a kind 💫",
      "4. Your friendship is for me it's a pure gold 🧡",
      "5. You make everything more fun just by being there 🎉",
      "6. You know me better than the rest",
      "7. You have a heart that shines brighter than any one 💗",
      "8. You’re awesome — no updates required 💻",
      "9. Never forget — you’re genuinely special for me forever 🧡",
      "10. In the World full of selfishness, you are a true Gem 💎",
      "11. Your positivity is infectious and uplifting 🌟",
      "12. Teri jo Baatein hai wo mujhe achhi lagti 😁",
      "13. Aap jaisa Insaan, Mast hai 🤗",
      "14. Aap Behaag, Behisab, Bemisaal Hoo 🤩",
      "15. Your the one of the best Listener 💕"
    ];

    function generateCompliment() {
      const randomIndex = Math.floor(Math.random() * compliments.length);
      const complimentBox = document.getElementById("compliment");
      complimentBox.style.opacity = 0;

      setTimeout(() => {
        complimentBox.innerHTML = compliments[randomIndex];
        complimentBox.style.opacity = 1;
      }, 300);
    }

    function nextDay() {
      const unlockDate = new Date("2026-05-25T00:00:00");
      const now = new Date();
      const lockMessage = document.getElementById("lockMessage");

      if (now >= unlockDate) {
        window.location.href = "day2.html";
      } else {
        const diff = unlockDate - now;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);

        lockMessage.style.display = "block";
        lockMessage.innerHTML = `🔒 Day 2 is locked 💛 <br><br>Opens in <b>${days}d ${hours}h ${minutes}m</b>`;
      }
    }
  </script>
</body>
</html>
